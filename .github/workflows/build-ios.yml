name: Build FreeSong iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'ios/**'
      - 'package.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Compilar IPA para iPhone
    runs-on: macos-14
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar dependencias
        run: npm install

      - name: Compilar estilos y assets web
        run: npm run build

      - name: Sincronizar proyecto iOS
        run: npx cap sync ios

      - name: Compilar archivo nativo con Xcode
        run: |
          xcodebuild -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Empaquetar archivo .ipa para Sideloadly / AltStore
        run: |
          mkdir -p Payload
          APP_PATH=$(find build -name "App.app" -type d | head -n 1)
          echo "App bundle encontrado en: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r FreeSong.ipa Payload
          ls -lh FreeSong.ipa

      - name: Subir FreeSong.ipa como descargable
        uses: actions/upload-artifact@v4
        with:
          name: FreeSong-iPhone-IPA
          path: FreeSong.ipa
          retention-days: 30
