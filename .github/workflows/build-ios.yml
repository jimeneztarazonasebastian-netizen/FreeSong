name: Build FreeSong iOS (IPA)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'www/**'
      - 'ios/**'
      - 'package.json'
      - '.github/workflows/build-ios.yml'

jobs:
  build-ios:
    name: Compilar IPA para iPhone
    runs-on: macos-14
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar dependencias
        run: npm install

      - name: Compilar estilos y assets web
        run: npm run build

      - name: Sincronizar proyecto iOS
        run: npx cap sync ios

      - name: Compilar archivo nativo con Xcode
        run: |
          xcodebuild -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/FreeSong.xcarchive \
            archive \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Empaquetar archivo .ipa para Sideloadly / AltStore
        run: |
          mkdir -p Payload
          cp -r build/FreeSong.xcarchive/Products/Applications/App.app Payload/
          zip -r FreeSong.ipa Payload
          ls -lh FreeSong.ipa

      - name: Subir FreeSong.ipa como descargable
        uses: actions/upload-artifact@v4
        with:
          name: FreeSong-iPhone-IPA
          path: FreeSong.ipa
          retention-days: 30
